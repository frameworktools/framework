# The r.framework.pub docs site. The format is inst/schema/docs-site.md,
# shared with framework-py and fw. reference.json is generated at release by
# docs_export(reference_path = "docs/site/reference.json") and not committed.
product: r
title: Framework for R
tagline: Structured data science projects in R
repository: https://github.com/frameworktools/framework
install: |-
  # Framework 2.0 beta, which works with Framework Cloud
  remotes::install_github("frameworktools/framework")

  # Framework 1.1 is on CRAN: install.packages("framework")
sections:
  - id: getting_started
    title: Getting started
  - id: project_types
    title: Project types
  - id: features
    title: Features
  - id: reference
    title: Reference
    reference: true
